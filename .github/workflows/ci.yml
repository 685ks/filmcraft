# Fast checks on every pull request and every push to main: formatting, the rebrand guard,
# dependency layering and asset attribution; the core crates' tests on Linux, macOS and Windows
# with a check that the desktop app builds on all three; and the app's own unit tests (control
# server and token, CLI parsing) with the automation bridge, the engine settings and the UI crate's
# unit tests on Linux. The full workspace suite is `cargo xtask ci` (run it locally).
#
# Every action is pinned by commit SHA. Values from the event go through `env:`, never straight
# into a `run:` script.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # This fork carries no ArtCraft marks or links and no storytold/craft-common-actions
      # workflows (house rules). LICENSE and NOTICE keep the upstream copyright line.
      - name: Rebrand guard
        run: |
          set -euo pipefail
          if git grep -nI 'craft-common-actions' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::storytold/craft-common-actions is not used in this fork"; exit 1
          fi
          if git grep -nIi -e 'getartcraft' -e 'discord\.gg/artcraft' -e 'ai\.storyteller\.filmcraft' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::ArtCraft/storyteller links or ids remain"; exit 1
          fi
          if [ -d docs/brand ]; then echo "::error::docs/brand (ArtCraft marks) must not exist"; exit 1; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency layering
        run: cargo xtask layers
      - name: Asset attribution
        run: cargo xtask assets

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Linux system dependencies (egui/winit/rfd/cpal)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Exact time, geometry, colour, the bit reader, the MP4 container, the project model and its
      # file format, and the text engine: the foundations every other crate stands on, and the
      # ones whose behaviour can differ by platform (paths, line endings, fonts).
      - name: Test core crates
        shell: bash
        run: >-
          cargo test --locked --lib --tests
          -p filmcraft-time -p filmcraft-geom -p filmcraft-color -p filmcraft-bitstream
          -p filmcraft-isobmff -p filmcraft-project -p filmcraft-format -p filmcraft-text
      - name: Check the desktop app and CLI build
        run: cargo check --locked -p filmcraft -p filmcraft-cli --bins

  app:
    name: app tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Free disk space and install Linux system dependencies
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev libasound2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The desktop app's unit tests (control server and its token, CLI parsing, packaging ids),
      # the MCP bridge, and the UI crate's unit tests (themes, links, About, menus, settings).
      - name: Test the app, the automation bridge and the UI
        run: cargo test --locked --lib --bins -p filmcraft -p filmcraft-automation -p filmcraft-ui-egui
      - name: Engine settings and preferences
        run: cargo test --locked -p filmcraft-engine --lib settings
      - name: Project links UI test
        run: cargo test --locked -p filmcraft-ui-egui --test links_ui --test settings_ui
